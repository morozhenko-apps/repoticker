name: Desktop release candidate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: repoticker-signed-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is main HEAD and all versions agree
        id: check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main^{commit})"
          python3 scripts/release_version.py --check-tag "$RELEASE_TAG"
          test -s Cargo.lock || { echo "Missing committed Cargo.lock" >&2; exit 1; }
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          echo "version=$(echo "$RELEASE_TAG" | cut -c 2-)" >> "$GITHUB_OUTPUT"
  linux:
    name: Linux amd64 DEB and AppImage
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install platform dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl file wget libssl-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-layer-shell-dev librsvg2-dev libfuse2t64 dpkg-dev libwayland-dev libwayland-bin wayland-protocols
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build Linux distributions
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles deb,appimage -- --locked
      - name: Verify Linux artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 scripts/release_assets.py collect --source target/release/bundle --target "$RUNNER_TEMP/linux" --platform linux --version "$VERSION"
          cd "$RUNNER_TEMP/linux"
          sha256sum -c ./*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: repoticker-linux
          path: ${{ runner.temp }}/linux/*
          if-no-files-found: error
          retention-days: 1
  windows:
    name: Windows x64 NSIS
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build installer
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles nsis -- --locked
      - name: Verify Windows artifact
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python scripts/release_assets.py collect --source target/release/bundle --target "$env:RUNNER_TEMP/windows" --platform windows --version "$env:VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: repoticker-windows
          path: ${{ runner.temp }}/windows/*
          if-no-files-found: error
          retention-days: 1
  macos:
    name: macOS stub (Apple Developer account unavailable)
    if: ${{ false }}
    runs-on: macos-15
    steps:
      - run: echo "macOS intentionally disabled"

  publish:
    needs: [validate, linux, windows]
    environment: apt-release
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      receipt: ${{ steps.publish.outputs.receipt }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      SIGNING_FPR: ${{ vars.REPOTICKER_APT_FINGERPRINT }}
      REPOTICKER_R2_ACCOUNT_ID: ${{ vars.REPOTICKER_R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: repoticker-linux
          path: ${{ runner.temp }}/release/linux
      - uses: actions/download-artifact@v4
        with:
          name: repoticker-windows
          path: ${{ runner.temp }}/release/windows
      - name: Check required environment and install tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SIGNING_FPR" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$REPOTICKER_R2_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev gnupg gpgv
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install --no-cache-dir \
            -r scripts/requirements-release.txt
          umask 077
          mkdir -p "$RUNNER_TEMP/private/gnupg"
          chmod 700 "$RUNNER_TEMP/private/gnupg"
      - name: Import signing SUBKEY from protected GitHub Secrets
        shell: bash
        env:
          SUBKEY_B64: ${{ secrets.REPOTICKER_APT_SIGNING_SUBKEY_BASE64 }}
          SUBKEY_PASSPHRASE: ${{ secrets.REPOTICKER_APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "$SUBKEY_B64" && -n "$SUBKEY_PASSPHRASE" ]]
          umask 077
          printf '%s' "$SUBKEY_B64" | base64 --decode > "$RUNNER_TEMP/private/import.gpg"
          printf '%s' "$SUBKEY_PASSPHRASE" > "$RUNNER_TEMP/private/passphrase"
          gpg --homedir "$RUNNER_TEMP/private/gnupg" --batch \
            --import "$RUNNER_TEMP/private/import.gpg" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/private/import.gpg"
          gpg --homedir "$RUNNER_TEMP/private/gnupg" --batch --with-colons \
            --list-secret-keys "$SIGNING_FPR" > "$RUNNER_TEMP/private/inventory"
          python3 scripts/verify_signing_key.py \
            --listing "$RUNNER_TEMP/private/inventory" --fingerprint "$SIGNING_FPR"
          rm -f "$RUNNER_TEMP/private/inventory"
      - name: Build signed APT snapshot
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find "$RUNNER_TEMP/release/linux" -maxdepth 1 -name 'repoticker_*.deb' -type f -print -quit)"
          test -n "$deb"
          python3 scripts/apt_repository.py \
            --deb "$deb" --out "$RUNNER_TEMP/apt" --version "$VERSION" \
            --gpg-home "$RUNNER_TEMP/private/gnupg" \
            --fingerprint "$SIGNING_FPR" \
            --passphrase-file "$RUNNER_TEMP/private/passphrase"
      - name: Verify flat R2 files, signed APT and latest manifest
        id: publish
        shell: bash
        env:
          REPOTICKER_R2_ACCESS_KEY_ID: ${{ secrets.REPOTICKER_R2_ACCESS_KEY_ID }}
          REPOTICKER_R2_SECRET_ACCESS_KEY: ${{ secrets.REPOTICKER_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/release-python/bin/python" scripts/r2_release.py \
            --release "$RUNNER_TEMP/release" --apt "$RUNNER_TEMP/apt" --version "$VERSION" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --receipt "$RUNNER_TEMP/publication-receipt.json"
          printf 'receipt=' >> "$GITHUB_OUTPUT"
          base64 -w0 "$RUNNER_TEMP/publication-receipt.json" >> "$GITHUB_OUTPUT"
          printf '\n' >> "$GITHUB_OUTPUT"
      - name: Securely clean signing files
        if: always()
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/private/gnupg" ]]; then
            gpgconf --homedir "$RUNNER_TEMP/private/gnupg" --kill gpg-agent || true
          fi
          rm -rf "$RUNNER_TEMP/private"

  cleanup:
    needs: [validate, linux, windows, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Remove exact temporary archives after verified public R2 readback
        env:
          RECEIPT_BASE64: ${{ needs.publish.outputs.receipt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$RECEIPT_BASE64" | base64 --decode > "$RUNNER_TEMP/receipt.json"
          node scripts/cleanup-published-artifacts.mjs --verified-receipt "$RUNNER_TEMP/receipt.json"
          rm -f "$RUNNER_TEMP/receipt.json"

  github-release:
    needs: [validate, publish, cleanup]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish text-only GitHub Release after verified R2 and cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "RepoTicker $GITHUB_REF_NAME" \
            --notes "RepoTicker $VERSION. Linux DEB and signed flat APT: https://download.morozhenko.com/dist/RepoTicker/linux/ . Direct AppImage and Windows installer links: https://download.morozhenko.com/dist/RepoTicker/latest.json . Windows NSIS is unsigned. Verify SHA256 before installation. No GitHub binary attachments."
