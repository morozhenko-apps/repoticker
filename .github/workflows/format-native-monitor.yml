name: Format native monitor implementation

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-native-monitor.yml'

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format with official Rust toolchain
        run: cargo fmt --all
      - name: Commit format-only source changes
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/desktop/src-tauri/src; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/desktop/src-tauri/src
          git commit -m "style: apply rustfmt to native GitHub monitor"
          git push origin HEAD:dev
