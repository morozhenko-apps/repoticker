name: Preflight

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'docs/**'
      - 'doc/**'
      - '**/*.md'
      - '**/*.mdx'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format_and_core:
    name: Rust format, core tests, Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Core tests
        run: cargo test -p repoticker-core
      - name: Core Clippy
        run: cargo clippy -p repoticker-core --all-targets -- -D warnings

  ui:
    name: Card model and JS syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          node --check apps/desktop/ui/model.mjs
          node --check apps/desktop/ui/app.mjs
      - name: JS unit tests
        run: node --test tests/*.test.mjs

  desktop:
    name: Desktop compile (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
      - name: Check desktop shell
        run: cargo check -p repoticker-desktop

  preflight:
    name: Preflight result
    if: always()
    needs: [format_and_core, ui, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all jobs green
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "$RESULTS"
          test "$RESULTS" = "success,success,success"
