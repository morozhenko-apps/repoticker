name: Preflight

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'docs/**'
      - 'doc/**'
      - '**/docs/**'
      - '**/doc/**'
      - 'README.md'
      - '**/README.md'
      - 'AGENT.md'
      - '**/AGENT.md'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - '**/CONTRIBUTING.md'
      - '.github/agents/**'
      - '.codex.md'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format_and_core:
    name: Rust format, core tests, Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      # Temporary lockfile resolution diagnostic, removed after repair.
      - name: Diagnose committed Cargo.lock drift
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          content = Path('Cargo.lock').read_bytes()
          print('CARGO_LOCK_SHA256:' + hashlib.sha256(content).hexdigest())
          encoded = base64.b64encode(content).decode('ascii')
          print('CARGO_LOCK_BEGIN:' + str(len(encoded)))
          for index, offset in enumerate(range(0, len(encoded), 3500)):
              print('CARGO_LOCK_CHUNK:{:04d}:{}'.format(index, encoded[offset:offset+3500]))
          print('CARGO_LOCK_END')
          PY
      - name: Core tests
        run: cargo test --locked -p repoticker-core
      - name: Core Clippy
        run: cargo clippy --locked -p repoticker-core --all-targets -- -D warnings

  ui:
    name: Card model and JS syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          node --check apps/desktop/ui/model.mjs
          node --check apps/desktop/ui/view.mjs
          node --check apps/desktop/ui/app.mjs
      - name: JS unit tests
        run: node --test tests/*.test.mjs
      - name: Install release contract tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg gpgv
      - name: Version and release metadata tests
        run: python3 -m unittest discover -s tests -p 'test_release_*.py' -v

  desktop:
    name: Desktop compile (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libgtk-layer-shell-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols
      - name: Check desktop shell
        run: cargo check --locked -p repoticker-desktop

  preflight:
    name: Preflight result
    if: always()
    needs: [format_and_core, ui, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all jobs green
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "$RESULTS"
          test "$RESULTS" = "success,success,success"
