name: Reconcile Cargo lockfile

# One-time dependency resolution for the native OAuth/keyring addition.
# This workflow is removed immediately after committing the generated lock.
on:
  push:
    branches: [dev]
    paths:
      - 'apps/desktop/src-tauri/Cargo.toml'

permissions:
  contents: write

concurrency:
  group: repoticker-lock-reconcile
  cancel-in-progress: false

jobs:
  lockfile:
    name: Resolve and commit native dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Cargo.lock with Cargo
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit only Cargo.lock
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m "build: refresh native GitHub OAuth dependency lockfile"
          git push origin "HEAD:dev"
