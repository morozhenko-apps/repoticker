# Temporary one-shot lockfile generator for the owner-approved Tauri autostart dependency.
# Remove after the generated lockfile is committed and verified.
name: Resolve autostart Cargo lockfile (one-shot)

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/refresh-autostart-lock.yml'

permissions:
  contents: write

jobs:
  resolve:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve pinned dependency without changing manifests
        run: |
          set -euo pipefail
          cargo fetch
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --check
      - name: Publish generated Cargo.lock to dev only
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build: resolve pinned Tauri autostart dependencies'
          git push origin HEAD:dev
