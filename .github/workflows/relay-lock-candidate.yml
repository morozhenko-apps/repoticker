# One-shot/manifest-triggered dependency-resolution evidence only.
# No repository writes, secret access, deployment or published release.
name: Native relay lock candidate (no publishing)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'apps/desktop/src-tauri/Cargo.toml'
      - '.github/workflows/relay-lock-candidate.yml'

permissions:
  contents: read

concurrency:
  group: repoticker-relay-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Cargo dependency graph and canonical format
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /dev/null
          cargo fmt --all
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --check
          printf '%s\n' "$GITHUB_SHA" > RELAY_SOURCE_SHA.txt
          sha256sum Cargo.lock > RELAY_CARGO_LOCK_SHA256.txt
          git diff -- Cargo.lock > RELAY_CARGO_LOCK_DIFF.patch
          git diff -- '*.rs' > RELAY_RUSTFMT_DIFF.patch
          git diff --name-only > RELAY_CHANGED_FILES.txt
          printf '%s\n' 'Unpublished dependency + formatting evidence. Apply only to the exact source SHA; review diffs before committing.' > RELAY_NOT_A_RELEASE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repoticker-native-relay-lock-candidate
          path: |
            Cargo.lock
            RELAY_SOURCE_SHA.txt
            RELAY_CARGO_LOCK_SHA256.txt
            RELAY_CARGO_LOCK_DIFF.patch
            RELAY_RUSTFMT_DIFF.patch
            RELAY_CHANGED_FILES.txt
            RELAY_NOT_A_RELEASE.txt
          if-no-files-found: error
          retention-days: 3
