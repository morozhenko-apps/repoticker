name: Strict quality gate (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stable_core_and_ui:
    name: Stable Rust, JS and release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust core tests
        run: cargo test --locked -p repoticker-core
      - name: Rust Clippy
        run: cargo clippy --locked -p repoticker-core --all-targets -- -D warnings
      - name: JavaScript stable tests
        run: node --test tests/*.test.mjs
      - name: Install release contract tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg gpgv
      - name: Python release stable tests
        run: python3 -m unittest discover -s tests -p 'test_release_*.py' -v
