name: Strict quality gate (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stable_core_and_ui:
    name: Stable Rust, JS and release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # Swatinem/rust-cache@v2.9.3
        with:
          workspaces: . -> target
          shared-key: repoticker-strict
          save-if: ${{ github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' }}
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust core tests
        run: cargo test --locked -p repoticker-core
      - name: Rust Clippy
        run: cargo clippy --locked -p repoticker-core --all-targets -- -D warnings
      - name: JavaScript stable tests
        run: node --test tests/*.test.mjs
      - name: Install release contract tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg gpgv python3-venv
      - name: Python release stable tests
        run: python3 -m unittest discover -s tests -p 'test_release_*.py' -v
      - name: CI policy and scope contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-policy"
          "$RUNNER_TEMP/ci-policy/bin/python" -m pip install -r scripts/requirements-ci.txt
          "$RUNNER_TEMP/ci-policy/bin/python" -m unittest discover -s tests -p 'test_ci_policy.py' -v
