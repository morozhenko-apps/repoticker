[package]
name = "repoticker-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RepoTicker tray shell"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
repoticker-core = { path = "../../../crates/repoticker-core" }
