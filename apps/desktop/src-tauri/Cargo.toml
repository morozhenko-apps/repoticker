[package]
name = "repoticker-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Stanislav Moseyko (morozhenko)"]
description = "RepoTicker lightweight desktop Git and CI companion"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
repoticker-core = { path = "../../../crates/repoticker-core" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
gtk = "0.18"
gtk-layer-shell = { version = "=0.8.2", features = ["v0_6"] }
