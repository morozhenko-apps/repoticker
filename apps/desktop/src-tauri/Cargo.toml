[package]
name = "repoticker"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Stanislav Moseyko (morozhenko)"]
description = "RepoTicker lightweight desktop Git and CI companion"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
repoticker-core = { path = "../../../crates/repoticker-core" }
# Native-only GitHub OAuth transport. Do not enable cookies, redirects or plaintext fallback.
reqwest = { version = "=0.13.5", default-features = false, features = ["form", "rustls"] }
# v1 selects Secret Service (KWallet) on Linux, Credential Manager on
# Windows and Keychain on macOS; no sample/in-memory store in production.
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
tokio = { version = "1", features = ["macros", "time", "sync"] }
# Native clipboard API; no general clipboard access is granted to JS.
tauri-plugin-clipboard-manager = "=2.3.3"
# Native-only system notifications; JS has no arbitrary notify permission.
tauri-plugin-notification = "=2.3.3"
# OS-owned login registration. WebView cannot invoke plugin commands directly.
tauri-plugin-autostart = "=2.7.0"
# One tray instance, including a login-launch followed by a manual launch.
tauri-plugin-single-instance = "=2.5.4"
# Native-only folder selection; no JS dialog or arbitrary filesystem permission.
tauri-plugin-dialog = "=2.8.3"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
gtk = "0.18"
gtk-layer-shell = { version = "=0.8.2", features = ["v0_6"] }
