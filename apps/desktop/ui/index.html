<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RepoTicker</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main id="card" class="card" data-view="compact">
    <section id="repo-drawer" class="drawer" aria-label="Repositories" hidden>
      <div id="repo-list" class="rows" aria-live="polite"></div>
    </section>

    <div id="notice" role="status" aria-live="polite" hidden></div>

    <div class="status-strip" aria-label="GitHub Actions and runners">
      <span id="runner-status" title="Runner availability is not connected">Runners —</span>
      <span id="ci-running" title="GitHub Actions is not connected">Running —</span>
      <span id="ci-queued" title="GitHub Actions is not connected">Queued —</span>
      <span class="quota-anchor" tabindex="0" aria-label="GitHub usage details" aria-describedby="quota-tooltip">
        <span aria-hidden="true">ⓘ</span>
        <span id="quota-tooltip" class="quota-tooltip" role="tooltip">GitHub Actions minutes are not available until billing permissions are granted. Self-hosted runner status does not measure CPU or RAM.</span>
      </span>
    </div>

    <nav class="actions" aria-label="Repository operations">
      <button id="fetch-all" class="action" type="button" title="Fetch remote references for enrolled repositories">
        <span class="action-icon" aria-hidden="true">⇄</span><span class="action-label">Fetch</span>
      </button>
      <button id="sync-all" class="action" type="button" disabled title="Fast-forward eligible clean branches from last Fetch (no network)">
        <span id="pull-indicator" class="action-icon" aria-hidden="true">↓</span>
        <span class="action-label">Safe pull</span>
      </button>
      <button id="show-repos" class="action" type="button" aria-pressed="false" title="Show repository list">
        <span class="action-icon" aria-hidden="true">▤</span><span class="action-label">Repos</span>
      </button>
      <button id="hide-card" class="action" type="button" title="Hide the card (keep RepoTicker running)">
        <span class="action-icon" aria-hidden="true">⌄</span><span class="action-label">Hide</span>
      </button>
    </nav>
  </main>
</body>
</html>
