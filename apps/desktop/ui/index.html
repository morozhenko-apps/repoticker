<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RepoTicker</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main id="card" class="card" data-view="compact">
    <section id="repo-drawer" class="drawer" aria-label="Repositories" hidden>
      <div id="repo-list" class="rows" aria-live="polite"></div>
      <div id="repo-menu" class="repo-menu" role="menu" aria-label="Repository actions" hidden></div>
    </section>

    <div id="notice" role="status" aria-live="polite" hidden></div>

    <div class="status-strip" aria-label="GitHub Actions and runners">
      <button id="runner-status" type="button" class="status-hover metric-button" aria-label="Refresh self-hosted runners" aria-expanded="false" aria-busy="false">
        <span class="metric-caption">Runners</span>
        <span id="runners-total" class="metric-neutral">—</span><span class="metric-divider">/</span>
        <span id="runners-online" class="metric-online">—</span><span class="metric-divider">/</span>
        <span id="runners-offline" class="metric-offline">—</span>
      </button>
      <button id="ci-tasks" type="button" class="status-hover metric-button" aria-label="Refresh running and queued Actions tasks" aria-expanded="false" aria-busy="false">
        <span class="metric-caption">Tasks</span>
        <span id="tasks-running" class="metric-online">—</span><span class="metric-divider">/</span>
        <span id="tasks-queued" class="metric-queued">—</span>
      </button>
      <span class="quota-anchor status-hover" tabindex="0" aria-label="GitHub-hosted free allowances" aria-expanded="false" data-open="false">
        <span aria-hidden="true">ⓘ</span>
      </span>
    </div>

    <nav class="actions" aria-label="Repository operations">
      <button id="fetch-all" class="action" type="button" title="Fetch remote references for enrolled repositories">
        <span class="action-icon" aria-hidden="true">⇄</span><span class="action-label">Fetch</span>
      </button>
      <button id="sync-all" class="action" type="button" disabled title="Safe sync: fast-forward behind or non-force push ahead (user action)">
        <span id="pull-indicator" class="action-icon" aria-hidden="true">⇅</span>
        <span class="action-label">Safe sync</span>
      </button>
      <button id="show-repos" class="action" type="button" aria-pressed="false" title="Show repository list">
        <span class="action-icon repo-glyph" aria-hidden="true"><span class="repo-symbol">▤</span><svg class="repo-spinner" viewBox="0 0 24 24" focusable="false"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span><span class="action-label">Repos</span>
      </button>
      <button id="hide-card" class="action" type="button" title="Hide the card (keep RepoTicker running)">
        <span class="action-icon hide-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" focusable="false"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="action-label">Hide</span>
      </button>
    </nav>
  </main>
</body>
</html>
