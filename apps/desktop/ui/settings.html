<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoTicker Settings</title>
  <link rel="stylesheet" href="./settings.css">
  <script type="module" src="./settings.mjs"></script>
</head>
<body>
<main class="settings-shell">
  <section class="block general">
    <h2>General</h2>
    <div class="general-line">
      <label for="language">Language</label>
      <select id="language"><option value="en">English</option><option value="ru">Русский</option></select>
      <span class="hint">Translations are planned</span>
    </div>
  </section>
  <section class="block repositories">
    <div class="section-heading"><h2>Local repositories</h2><span class="hint">Direct children only</span></div>
    <form id="add-root-form" class="inline">
      <label for="root-path" class="sr-only">Repository folder</label>
      <input id="root-path" required placeholder="~/Documents/GitHub" autocomplete="off">
      <button type="submit">Add folder</button>
    </form>
    <div id="roots-list" class="roots-list"></div>
  </section>
  <section class="block github">
    <div class="section-heading"><h2>GitHub &amp; Relay</h2><span class="hint">Not connected yet</span></div>
    <div class="github-grid">
      <label>GitHub account<input disabled placeholder="Not connected"></label>
      <label>Connection mode<select disabled><option>Simple polling</option><option>Hybrid webhook relay</option></select></label>
      <label class="worker-label">Worker URL<input disabled placeholder="https://your-worker.example"></label>
    </div>
  </section>
  <div class="settings-footer">
    <span id="message" role="status" aria-live="polite"></span>
    <div class="footer-buttons">
      <button id="cancel-settings" type="button">Cancel</button>
      <button id="apply-settings" type="button" class="primary" disabled>Apply</button>
    </div>
  </div>
</main>
</body>
</html>
