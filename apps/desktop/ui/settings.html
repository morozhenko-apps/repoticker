<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoTicker Settings</title>
  <link rel="stylesheet" href="./settings.css">
  <script type="module" src="./settings.mjs"></script>
</head>
<body>
<main class="settings-shell">
  <section class="block general">
    <h2>General</h2>
    <div class="general-line">
      <label for="language-trigger">Language</label>
      <div class="language-picker">
        <button id="language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-options">English <span aria-hidden="true">▾</span></button>
        <div id="language-options" role="listbox" tabindex="-1" aria-label="Language" hidden>
          <button type="button" role="option" data-value="en" aria-selected="true">English</button>
          <button type="button" role="option" data-value="ru" aria-selected="false">Русский</button>
        </div>
      </div>
      <span class="hint">Translations are planned</span>
    </div>
  </section>
  <section class="block repositories">
    <div class="section-heading"><h2>Local repositories</h2><span class="hint">Direct children only</span></div>
    <form id="add-root-form" class="inline">
      <label for="root-path" class="sr-only">Repository folder</label>
      <input id="root-path" required placeholder="~/Documents/GitHub" autocomplete="off">
      <button type="submit">Add folder</button>
    </form>
    <div id="roots-list" class="roots-list"></div>
  </section>
  <section class="block github">
    <div class="section-heading"><h2>GitHub &amp; Relay</h2><span id="github-connection-indicator" class="hint">Not connected</span></div>
    <div class="github-auth-controls">
      <button id="github-connect" type="button">Connect GitHub</button>
      <button id="github-disconnect" type="button" hidden>Disconnect</button>
      <span id="github-auth-message" class="hint" role="status" aria-live="polite">Uses secure device authorization.</span>
    </div>
    <div id="github-device-flow" class="github-device-flow" hidden>
      <span>Enter this code on GitHub:</span>
      <strong id="github-user-code" class="github-user-code"></strong>
      <button id="github-copy-code" type="button">Copy code</button>
      <button id="github-open-device" type="button">Open GitHub</button>
      <button id="github-cancel-device" type="button">Cancel</button>
    </div>

    <div class="github-grid">
      <label>GitHub authorization<input id="github-account-status" disabled value="Not connected"></label>
      <label id="github-monitor-scope-row" hidden>Monitor account
        <select id="github-monitor-scope"><option value="">Choose account</option></select>
      </label>
      <label>Connection mode<select id="github-connection-mode" disabled>
        <option value="polling">Simple polling</option>
        <option value="hybrid">Hybrid webhook relay (not available yet)</option>
      </select></label>
      <label id="github-worker-row" class="worker-label" hidden>Worker URL
        <input id="github-worker-url" disabled placeholder="https://your-worker.example">
      </label>
    </div>
  </section>
  <div class="settings-footer">
    <span id="message" role="status" aria-live="polite"></span>
    <div class="footer-buttons">
      <button id="cancel-settings" type="button">Cancel</button>
      <button id="apply-settings" type="button" class="primary" disabled>OK</button>
    </div>
  </div>
</main>
</body>
</html>
