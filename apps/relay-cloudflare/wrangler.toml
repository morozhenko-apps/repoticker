# Operator-owned Worker; name must match the existing Cloudflare service.
# Do not place repository names or secrets here.
name = "repoticker-relay"
main = "src/index.ts"
compatibility_date = "2026-11-08"

[[durable_objects.bindings]]
name = "RELAY_HUB"
class_name = "RelayHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayHub"]
